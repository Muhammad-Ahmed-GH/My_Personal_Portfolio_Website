<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Muhammad Ahmed | Frontend Developer. Sharing my projects and skills in my career on this portfolio website. Let's build something amazing!"
    />
    <title>Muhammad Ahmed | Portfolio Website</title>

    <!-- favicon of the website -->
    <link rel="icon" href="images/favicon_light.png" />
    <!-- google fonts (Rubik) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- google fonts (Rufina) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- devicon icons -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
    <link rel="stylesheet" href="css/normalize.css" />
    <!-- main css file -->
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <header>
      <div class="container">
        <h1 class="logo">
          <a href="#main">muhammad ahmed</a>
        </h1>
        <nav>
          <div class="links">
            <div class="bars">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <ul>
            </ul>
          </div>
          <a
            href="#"
            class="main-btn resume-link"
            target="_blank"
            rel="noopener"
            >View My Resume</a
          >
        </nav>
      </div>
    </header>

    <section class="landing" id="main">
      <div class="container">
        <p class="greeting">
          Hey there, thanks for passing by
          <span>I'm Muhammad<br />Frontend Developer</span>
        </p>
        <p class="desc">
          I'm an aspiring web developer, and a computer science student
        </p>
        <div class="landing-btns">
          <a href="#projects" class="main-btn">View my work</a>
          <a
            class="alt-btn resume-link"
            href="#"
            target="_blank"
            rel="noopener"
          >
            My resume
          </a>
        </div>
        <div class="social-icons">
        </div>
      </div>
    </section>
    <section class="about-me" id="about-me">
      <div class="container">
        <h2 class="title">About Me</h2>
        <div class="cards"></div>
      </div>
    </section>
    <section class="skills" id="skills">
      <div class="container">
        <h2 class="title">Skills</h2>
        <div class="cards"></div>
        <h2 class="title">Next to Learn</h2>
        <div class="cards"></div>
      </div>
    </section>
    <section class="projects" id="projects">
      <div class="container">
        <h2 class="title">Projects</h2>
        <div class="cards"></div>
      </div>
    </section>
    <section class="contact" id="contact">
      <div class="container">
        <h2 class="title">Contact Me!</h2>
        <div class="cards">
          <div class="card emails">
            <i class="icon fa-solid fa-envelope"></i>
            <h3>Email</h3>
            <ul>
            </ul>
          </div>
          <div class="card phones">
            <i class="icon fa-solid fa-phone-flip"></i>
            <h3>Phone</h3>
            <ul>
            </ul>
          </div>
        </div>
      </div>
    </section>
    <footer>
      <div class="container">
        <p>Copyright @<strong>Muhammad Ahmed</strong></p>
        <div class="social-icons">
        </div>
      </div>
    </footer>
    <div class="scroll-btn">
      <i class="fa-solid fa-arrow-up"></i>
    </div>
    <script src="https://kit.fontawesome.com/ccf9235cab.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
  </body>
</html>
